# YOLO26n with grouped-normalized MLLA at P5 and DySampleFusion in the neck.

nc: 80
end2end: true
reg_max: 1
scale: n
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9-P5/32
  - [-1, 2, C2PSA, [1024]] # 10-P5/32
  - [-1, 1, MLLAttentionWithGroupedNorm, []] # 11-P5/32

head:
  - [-1, 1, DySampleFusion, []] # 12-P4/16
  - [[-1, 6], 1, Concat, [1]] # 13-P4/16
  - [-1, 2, C3k2, [512, True]] # 14-P4/16

  - [-1, 1, DySampleFusion, []] # 15-P3/8
  - [[-1, 4], 1, Concat, [1]] # 16-P3/8
  - [-1, 2, C3k2, [256, True]] # 17-P3/8-small

  - [-1, 1, Conv, [256, 3, 2]] # 18-P4/16
  - [[-1, 14], 1, Concat, [1]] # 19-P4/16
  - [-1, 2, C3k2, [512, True]] # 20-P4/16-medium

  - [-1, 1, Conv, [512, 3, 2]] # 21-P5/32
  - [[-1, 11], 1, Concat, [1]] # 22-P5/32
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 23-P5/32-large

  - [[17, 20, 23], 1, Detect, [nc]]
