# YOLOv8n with grouped-normalized MLLA at P5 and DySampleFusion in the neck.

nc: 80
scale: n
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]] # 9-P5/32
  - [-1, 1, MLLAttentionWithGroupedNorm, []] # 10-P5/32

head:
  - [-1, 1, DySampleFusion, []] # 11-P4/16
  - [[-1, 6], 1, Concat, [1]] # 12-P4/16
  - [-1, 3, C2f, [512]] # 13-P4/16

  - [-1, 1, DySampleFusion, []] # 14-P3/8
  - [[-1, 4], 1, Concat, [1]] # 15-P3/8
  - [-1, 3, C2f, [256]] # 16-P3/8-small

  - [-1, 1, Conv, [256, 3, 2]] # 17-P4/16
  - [[-1, 13], 1, Concat, [1]] # 18-P4/16
  - [-1, 3, C2f, [512]] # 19-P4/16-medium

  - [-1, 1, Conv, [512, 3, 2]] # 20-P5/32
  - [[-1, 10], 1, Concat, [1]] # 21-P5/32
  - [-1, 3, C2f, [1024]] # 22-P5/32-large

  - [[16, 19, 22], 1, Detect, [nc]]
