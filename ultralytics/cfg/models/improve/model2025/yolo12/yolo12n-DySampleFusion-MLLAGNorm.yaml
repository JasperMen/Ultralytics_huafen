# YOLO12n with grouped-normalized MLLA at P5 and DySampleFusion in the neck.

nc: 80
scale: n
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4, "v1"]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1, "v1"]] # 8-P5/32
  - [-1, 1, MLLAttentionWithGroupedNorm, []] # 9-P5/32

head:
  - [-1, 1, DySampleFusion, []] # 10-P4/16
  - [[-1, 6], 1, Concat, [1]] # 11-P4/16
  - [-1, 2, A2C2f, [512, False, -1, "v1"]] # 12-P4/16

  - [-1, 1, DySampleFusion, []] # 13-P3/8
  - [[-1, 4], 1, Concat, [1]] # 14-P3/8
  - [-1, 2, A2C2f, [256, False, -1, "v1"]] # 15-P3/8-small

  - [-1, 1, Conv, [256, 3, 2]] # 16-P4/16
  - [[-1, 12], 1, Concat, [1]] # 17-P4/16
  - [-1, 2, A2C2f, [512, False, -1, "v1"]] # 18-P4/16-medium

  - [-1, 1, Conv, [512, 3, 2]] # 19-P5/32
  - [[-1, 9], 1, Concat, [1]] # 20-P5/32
  - [-1, 2, C3k2, [1024, True]] # 21-P5/32-large

  - [[15, 18, 21], 1, Detect, [nc]]
